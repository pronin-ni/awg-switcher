name: CI and release gates

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests-and-license:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27.3'
          cache: true
      - name: Tests, race detector, vet
        run: |
          go test ./...
          go test -race ./...
          go vet ./...
      - name: Embedded UI syntax and Compose validation
        run: |
          node --check cmd/awg-switcher/web/app.js
          node --check cmd/awg-switcher/web/setup.js
          node --check cmd/awg-switcher/web/diagnostics.js
          node --check cmd/awg-switcher/web/config-generator.js
          node --check cmd/awg-switcher/web/website-monitor.js
          docker compose -f docker-compose.yml config --quiet
          docker compose -f docker-compose.yml -f docker-compose.lan.example.yml config --quiet
          docker compose -f generator/docker-compose.yml config --quiet
      - name: Dependency vulnerability scan
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./...
      - name: Validate Compose model
        run: docker compose -f docker-compose.yml config --quiet
      - name: License audit for AWG Switcher and Go modules
        run: |
          go run github.com/google/go-licenses@v1.6.0 check --include_tests --allowed_licenses=MIT,ISC,Apache-2.0,BSD-3-Clause ./...
          go run github.com/google/go-licenses@v1.6.0 csv --include_tests ./... | tee licenses/go-modules.csv
      - name: Audit pinned wireproxy dependency tree
        run: |
          git clone --quiet --depth 1 --branch v2.1.0 https://github.com/bropines/awg-wireproxy.git "$RUNNER_TEMP/wireproxy"
          test "$(git -C "$RUNNER_TEMP/wireproxy" rev-parse HEAD)" = 02588433b6328171b594d76f3f16bd3404258a83
          cd "$RUNNER_TEMP/wireproxy"
          go get golang.org/x/net@v0.62.0 golang.org/x/crypto@v0.58.0
          go run golang.org/x/vuln/cmd/govulncheck@v1.2.0 ./cmd/wireproxy
          go run github.com/google/go-licenses@v1.6.0 check --allowed_licenses=MIT,ISC,Apache-2.0,BSD-3-Clause,GPL-2.0 ./...
          go run github.com/google/go-licenses@v1.6.0 csv ./... | tee "$GITHUB_WORKSPACE/licenses/wireproxy-go-modules.csv"
          python3 - "$GITHUB_WORKSPACE/licenses/wireproxy-go-modules.csv" <<'PY'
          import csv, sys
          allowed = {"MIT", "ISC", "Apache-2.0", "BSD-3-Clause"}
          selected_dual_license = "kernel.org/pub/linux/libs/security/libcap/psx"
          seen_dual = False
          with open(sys.argv[1], newline="") as f:
              for package, _url, license_id in csv.reader(f):
                  if license_id in allowed:
                      continue
                  if package == selected_dual_license and license_id == "GPL-2.0":
                      # The exact module's SPDX expression is BSD-3-Clause OR GPL-2.0-only.
                      # BSD-3-Clause is selected and its complete upstream License file is bundled.
                      seen_dual = True
                      continue
                  raise SystemExit(f"unapproved/unreviewed license: {package}: {license_id}")
          if not seen_dual:
              raise SystemExit("expected manually reviewed libcap/psx dual-license entry is missing")
          PY
      - name: Secret scan (full checkout history)
        run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --redact --exit-code 1 .
      - name: Build Linux amd64 binary
        run: mkdir -p dist && CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o dist/awg-switcher ./cmd/awg-switcher
      - name: Build container
        run: docker build --platform linux/amd64 -t awg-switcher:ci .
      - name: Browser smoke test on an empty volume
        run: |
          npm install --no-save --no-package-lock playwright@1.55.0
          npx playwright install --with-deps chromium
          node tests/browser-smoke.mjs
      - name: Container license inventory
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: awg-switcher:ci
          scanners: license
          format: table
          exit-code: '1'
      - name: Generate image SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          image: awg-switcher:ci
          format: cyclonedx-json
          output-file: image-sbom.cdx.json
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: awg-switcher-image-sbom
          path: image-sbom.cdx.json
          if-no-files-found: warn

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v5
        with:
          config-file: .github/dependency-review-config.yml
          fail-on-severity: moderate
          deny-licenses: GPL-2.0, GPL-3.0, AGPL-3.0, LGPL-2.1, LGPL-3.0

  publish-dev:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [tests-and-license]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Publish development image
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.sha }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:dev
            ghcr.io/${{ github.repository }}:${{ github.sha }}
          sbom: true
          provenance: mode=max

      - name: Report development image digest
        run: |
          echo "Published ghcr.io/${GITHUB_REPOSITORY}:dev@${{ steps.image.outputs.digest }}" >> "$GITHUB_STEP_SUMMARY"

  publish-ghcr:
    if: startsWith(github.ref, 'refs/tags/v') && vars.ALLOW_PUBLIC_RELEASE == 'true' && vars.LICENSE_REVIEW_PASSED == 'true' && vars.LIVE_VALIDATION_PASSED == 'true'
    needs: [tests-and-license]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: image
        name: Normalize GHCR image name
        run: echo "name=ghcr.io/$(echo "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Build and publish tagged image with SBOM and provenance
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          build-args: APP_VERSION=${{ github.ref_name }}
          push: true
          tags: ${{ steps.image.outputs.name }}:${{ github.ref_name }}
          sbom: true
          provenance: mode=max
