proxy:
  http_port: 20171
# Web UI/admin API listen on 8080 and are not published to the host by default.
# Set AWG_ADMIN_LISTEN in Compose only when intentionally binding to a trusted interface.
profiles:
  directory: /app/configs
  primary: primary.conf
  priority:
    - primary.conf
    - backup1.conf
    - backup2.conf
failover:
  enabled: true
  check_interval: 15s
  check_timeout: 8s
  failure_threshold: 2
  recovery_threshold: 3
  recovery_interval: 60s
  switch_cooldown: 30s
health:
  urls:
    - https://api.ipify.org
    - https://www.cloudflare.com/cdn-cgi/trace
  required_successes: 1
