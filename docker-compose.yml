services:
  awg-switcher:
    image: ghcr.io/pronin-ni/awg-switcher:dev
    container_name: awg-switcher
    restart: unless-stopped
    stop_grace_period: 25s
    read_only: true
    tmpfs:
      - /run/awg-switcher:rw,noexec,nosuid,size=16m,uid=10001,gid=10001
    ports:
      - "192.168.31.12:2080:8080"
    volumes:
      - /Volume2/docker/awg-switcher:/app/data
    environment:
      AWG_DATA_DIR: /app/data
      AWG_ADMIN_LISTEN: 0.0.0.0:8080
      AWG_COOKIE_SECURE: "false"
    networks:
      - proxy-network
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    mem_limit: 512m
    cpus: 1.5

networks:
  proxy-network:
    external: true
